[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-catalog"
version = "0.1.0"
description = "Literature catalog and knowledge mapping system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "PyYAML",
]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
